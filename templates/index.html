<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Emotion Analysis</title>
    <style>
        /* CSS: Used for static UI styling only */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            color: white;
            animation: fadeIn 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
        }

        .label {
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .score {
            font-size: 1rem;
            opacity: 0.9;
            background-color: rgba(0, 0, 0, 0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎭 AI Emotion Detector</h1>
        <p>Enter an English sentence to let AI guess your emotion</p>

        <form method="POST">
            <textarea name="text_input"
                placeholder="Example: I was so surprised to see him there!">{{ text_input }}</textarea>
            <br>
            <button type="submit">Analyze Now</button>
        </form>

        {% if result %}
        <div class="result-box" style="background-color: {{ result.color }};">
            <span class="emoji">{{ result.icon }}</span>
            <div class="label">{{ result.label }}</div>
            <div class="score">Confidence: {{ score }}</div>
        </div>
        {% endif %}
    </div>
</body>

</html>
